<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a2b">
<title>عالم المغامرات العجيب – النسخة الواقعية المتقدمة</title>
<style>
:root{--gold:#ffd36a;--panel:rgba(9,18,34,.9);--line:rgba(255,255,255,.25)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2b;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#263d5d,#0b1425);z-index:20}
.loadbox{padding:25px 32px;border:1px solid #ffffff33;border-radius:22px;background:#101b30dd;text-align:center;box-shadow:0 20px 70px #0008}
.loadbox h1{color:var(--gold);margin:0 0 10px;font-size:clamp(22px,5vw,38px)}.loadbox p{margin:0;color:#d8e5f7}
#menu{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(90deg,#091323aa,#09132355),radial-gradient(circle at 50% 30%,#476b85aa,transparent 55%)}
.panel{width:min(640px,96vw);max-height:92vh;overflow:auto;padding:22px;border:1px solid #ffffff33;border-radius:25px;background:linear-gradient(145deg,#14263ceF,#0b1528ee);box-shadow:0 25px 90px #0009;text-align:center}
h1{font-size:clamp(27px,6vw,42px);margin:0 0 7px;color:var(--gold);text-shadow:0 4px 18px #ffb32b55}
.sub{color:#d6e3f5;margin:0 0 16px;font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button,.filelabel{border:1px solid #ffffff30;background:linear-gradient(#365579,#203a59);color:white;padding:11px 16px;border-radius:13px;font-weight:bold;font-size:14px;cursor:pointer}
button:active,.filelabel:active{transform:scale(.97)}button.primary{background:linear-gradient(#ffcf68,#dc8e27);color:#271706;border:0;min-width:180px}
button.selected{outline:3px solid var(--gold);background:linear-gradient(#80602a,#4b361b)}
.filelabel{display:inline-flex;align-items:center;gap:8px}.filelabel input{display:none}
#status{min-height:22px;color:#aee6ff;font-size:13px;margin:8px}
#hud{position:absolute;top:12px;left:12px;right:12px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;gap:8px}
.hudbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 13px;backdrop-filter:blur(8px);font-size:13px;text-shadow:0 1px 4px #000;display:flex;gap:10px;align-items:center}
.bar-container{width:75px;height:9px;background:#111;border-radius:5px;overflow:hidden;border:1px solid #ffffff33;display:inline-block;vertical-align:middle}
.bar-fill{height:100%;background:linear-gradient(90deg,#4ae,#6ff);width:100%;transition:width .2s}
#hudRight{display:flex;gap:7px;pointer-events:auto}#hudRight button{padding:8px 12px;font-size:13px}
#controls{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:14px;display:none;gap:9px;align-items:flex-end;z-index:6;direction:ltr;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
.act{display:grid;grid-template-columns:repeat(2,48px);grid-template-rows:repeat(3,48px);gap:4px}
.ctrl{width:52px;height:52px;padding:0;border-radius:16px;background:linear-gradient(145deg,#385b7cdd,#122943ee);border:1px solid #ffffff55;box-shadow:0 5px 14px #0006;font-size:20px;touch-action:none;user-select:none}
.act .ctrl{width:52px;height:52px;font-size:18px}
#upBtn{grid-column:2;grid-row:1}#leftBtn{grid-column:1;grid-row:2}#rightBtn{grid-column:3;grid-row:2}#downBtn{grid-column:2;grid-row:3}
#hint{position:absolute;bottom:14px;right:14px;max-width:240px;padding:9px 12px;border-radius:12px;background:#081426cc;color:#e4eefb;font-size:12px;z-index:4;pointer-events:none;border:1px solid var(--line)}
#message{position:absolute;top:20%;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:14px;background:#101b2df0;border:1px solid #ffffff55;color:#ffe09a;font-weight:bold;display:none;z-index:8;text-align:center;box-shadow:0 10px 30px #0008}
#stagebar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.small{font-size:12px;color:#bdcde1;line-height:1.7}
@media(max-width:650px){.panel{padding:15px}.hudbox{font-size:11px;padding:7px 9px}#hint{display:none}#controls{left:8px;bottom:max(8px,env(safe-area-inset-bottom));gap:5px}.pad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}.ctrl{width:42px;height:42px;border-radius:13px}.act{grid-template-columns:repeat(2,44px);grid-template-rows:repeat(3,44px)}.act .ctrl{width:44px;height:44px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div class="loadbox"><h1>عالم المغامرات العجيب</h1><p>جارٍ تجهيز البيئات الداخلية والذكاء الاصطناعي...</p></div></div>
<div id="menu">
 <div class="panel">
  <h1>عالم المغامرات العجيب</h1>
  <p class="sub">مباني حقيقية قابلة للاستكشاف + حراس بذكاء اصطناعي ومطاردة نشطة</p>
  <div class="row">
   <button id="sara" class="selected">الأميرة سارة</button>
   <button id="moh">الفارس محمد</button>
  </div>
  <div class="row" style="margin-top:10px">
   <label class="filelabel">📷 صورة الوجه<input id="photo" type="file" accept="image/*"></label>
   <button id="removePhoto">إزالة الصورة</button>
  </div>
  <div id="stagebar">
   <button data-stage="0" class="selected">الغابة السحرية</button>
   <button data-stage="1">الصحراء الذهبية</button>
   <button data-stage="2">مملكة الجليد</button>
   <button data-stage="3">وادي البركان</button>
  </div>
  <p class="small">أعلى نتيجة: <span id="highScoreText">0</span> | الحراس يشعرون بك عند الاقتراب ويبدأون بمطاردتك!</p>
  <div class="row"><button id="sound">🔊 الصوت يعمل</button><button id="start" class="primary">ابدأ المغامرة ▶</button></div>
  <div id="status"></div>
 </div>
</div>
<div id="hud">
 <div class="hudbox">
  <span>💎 <span id="score">0</span></span>
  <span>❤️ <span id="lives">3</span></span>
  <span>⚡ مانا: <div class="bar-container"><div id="manaFill" class="bar-fill"></div></div></span>
  <span>🏰 <span id="stageName">الغابة السحرية</span></span>
 </div>
 <div id="hudRight"><button id="pause">Ⅱ إيقاف</button><button id="back">القائمة</button></div>
</div>
<div id="controls">
 <div class="pad">
  <button class="ctrl" id="upBtn">⬆</button><button class="ctrl" id="leftBtn">◀</button><button class="ctrl" id="rightBtn">▶</button><button class="ctrl" id="downBtn">⬇</button>
 </div>
 <div class="act">
  <button class="ctrl" id="jumpBtn">⤒</button><button class="ctrl" id="attackBtn">⚔️</button>
  <button class="ctrl" id="rollBtn">🛡️</button><button class="ctrl" id="magicBtn">✨</button>
  <button class="ctrl" id="interactBtn">🚪</button>
 </div>
</div>
<div id="hint">اقترب من القلعة واضغط 🚪 للدخول</div>
<div id="message"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
const stageNames=['الغابة السحرية','الصحراء الذهبية','مملكة الجليد','وادي البركان الزعيم'];
const stageColors=[
 {sky:0x7ec8e3,ground:0x3b633d,stone:0x787364,wall:0x8d8370,roof:0x4e362f,accent:0xf1be42},
 {sky:0xedd3a3,ground:0xa67c41,stone:0x8e6c43,wall:0xb8925c,roof:0x633c27,accent:0xffd15c},
 {sky:0x8ec3df,ground:0x88aab8,stone:0x88a4b3,wall:0xb2d6e3,roof:0x466c87,accent:0x7cedff},
 {sky:0x592832,ground:0x3d201e,stone:0x3b3332,wall:0x543f3b,roof:0x221c1e,accent:0xff8822}
];

let scene,camera,renderer,clock,world,player,faceTexture=null,photoURL=null;
let selected='sara',stage=0,score=0,lives=3,mana=100,highScore=0,playing=false,paused=false,soundOn=true,isInside=false;
let keys={left:false,right:false,down:false,up:false},enemies=[],gems=[],projectiles=[],walls=[],gate=null,doorTrigger=null,interiorGroup=null;
let audioCtx=null,bgmInterval=null;

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const mat=(color,rough=.85,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});

function box(parent,x,y,z,w,h,d,material,isWall=false){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);
 if(isWall) walls.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});
 return m;
}
function sphere(parent,x,y,z,r,material){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
function cylinder(parent,x,y,z,r1,r2,h,material){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}

function message(t){$('message').textContent=t;$('message').style.display='block';clearTimeout(message.timer);message.timer=setTimeout(()=>$('message').style.display='none',2400)}

function init(){
 highScore=Number(localStorage.getItem('adv_highScore')||0);
 $('highScoreText').textContent=highScore;

 scene=new THREE.Scene();
 scene.background=new THREE.Color(stageColors[0].sky);
 scene.fog=new THREE.FogExp2(stageColors[0].sky,0.018);

 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,220);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 $('game').appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xdceeff,0x3a2c1d,1.8));
 const sun=new THREE.DirectionalLight(0xfff2df,2.8);
 sun.position.set(-20,35,20);sun.castShadow=true;
 scene.add(sun);

 clock=new THREE.Clock();
 createPlayer();
 buildStage(0);
 resize();
 animate();
 $('loading').style.display='none';
}

function clearWorld(){
 if(world){scene.remove(world);world.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
 world=new THREE.Group();scene.add(world);
 enemies=[];gems=[];projectiles=[];walls=[];gate=null;doorTrigger=null;isInside=false;interiorGroup=null;
}

function makeCastleExterior(x,z,scale=1,isBoss=false){
 const c=stageColors[stage],g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);world.add(g);
 const stone=mat(c.wall),trim=mat(c.accent,.5,.3),roof=mat(c.roof),dark=mat(0x1b1616);
 const w=isBoss?18:11,h=isBoss?14:9,d=isBoss?12:7;
 
 box(g,0,h/2,0,w,h,d,stone,true);
 for(const tx of [-w/2-.4,w/2+.4]){
  cylinder(g,tx,h+1,0,isBoss?2.2:1.55,isBoss?2.2:1.55,isBoss?2.4:1.7,stone);
  const r=new THREE.Mesh(new THREE.ConeGeometry(isBoss?2.6:1.9,isBoss?3.8:3,8),roof);
  r.position.set(tx,h+(isBoss?3.4:2.9),0);g.add(r);
 }
 const doorW=isBoss?4:2.5,doorH=isBoss?5.5:3.7;
 box(g,0,doorH/2,-d/2-.28,doorW,doorH,.18,dark);
 return {group:g,doorZ:z-d/2-2.2,doorX:x};
}

// بناء الغرفة الداخلية الحقيقية عند الدخول للقلعة
function enterCastleInterior(){
 isInside=true;
 clearWorld();
 interiorGroup=new THREE.Group();
 scene.add(interiorGroup);

 const c=stageColors[stage];
 scene.background.setHex(0x0b1320);
 scene.fog.color.setHex(0x0b1320);

 // أرضية الغرفة وجدرانها الداخلية
 box(interiorGroup,0,-0.35,0,30,.7,30,mat(c.stone));
 box(interiorGroup,0,5,-15,30,10,1,mat(c.wall),true);
 box(interiorGroup,-15,5,0,1,10,30,mat(c.wall),true);
 box(interiorGroup,15,5,0,1,10,30,mat(c.wall),true);
 box(interiorGroup,0,5,15,30,10,1,mat(c.wall),true);

 // إضاءة داخلية دافئة مشاعل
 const pLight=new THREE.PointLight(c.accent,2.5,20);
 pLight.position.set(0,6,0);
 interiorGroup.add(pLight);

 // صندوق كنز في الداخل وجواهر
 const chest=new THREE.Mesh(new THREE.BoxGeometry(1.5,1,1),mat(0x805533,.3,.5));
 chest.position.set(0,0.5,-10);
 interiorGroup.add(chest);

 for(let i=0;i<8;i++){
  const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.45),mat(c.accent,.2,.6));
  gem.position.set((Math.random()-.5)*12,1,(Math.random()-.5)*12);
  interiorGroup.add(gem);
  gems.push({mesh:gem,taken:false});
 }

 // حارس الغرفة الداخلية الشرس
 const e=createEnemy(0,-6,true);
 interiorGroup.add(e.group);
 enemies.push(e);

 player.root.position.set(0,0,10);
 message('دخلت إلى قاعة القلعة الداخلية! احذر الحارس!');
}

function buildStage(idx){
 stage=idx;clearWorld();
 const c=stageColors[stage];
 scene.background.setHex(c.sky);
 scene.fog.color.setHex(c.sky);

 const floor=box(world,0,-.35,0,160,.7,160,mat(c.ground));
 floor.receiveShadow=true;

 const main=makeCastleExterior(0,-30,1,stage===3);
 gate=main;
 doorTrigger={x:main.doorX,z:main.doorZ,r:3.8};

 for(let i=0;i<12;i++){
  const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.5),mat(c.accent,.2,.6));
  gem.position.set((Math.random()-.5)*26,1,8-Math.random()*40);
  world.add(gem);
  gems.push({mesh:gem,taken:false});
 }

 for(let i=0;i<4;i++){
  const e=createEnemy((i%2?1:-1)*(6+Math.random()*10),-5-i*8,false);
  world.add(e.group);
  enemies.push(e);
 }

 player.root.position.set(0,0,10);
 player.velocity.set(0,0,0);
 player.yaw=Math.PI;
 $('stageName').textContent=stageNames[stage];
 updateHud();
}

function createLimb(parent,length,radius,material){
 const pivot=new THREE.Group();parent.add(pivot);
 const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(radius,length*.65,4,8),material);
 mesh.position.y=-length*.42;mesh.castShadow=true;pivot.add(mesh);
 return pivot;
}

function createPlayer(){
 const root=new THREE.Group();scene.add(root);
 const skin=mat(0xe0a77d),cloth=mat(0x285f9a),pants=mat(0x26354d),boots=mat(0x382b25),gold=mat(0xe9b84e,.3,.6);
 const torso=new THREE.Group();root.add(torso);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.82,5,10),cloth);body.position.y=1.35;body.castShadow=true;torso.add(body);
 const belt=new THREE.Mesh(new THREE.TorusGeometry(.43,.07,8,20),gold);belt.position.y=.95;belt.rotation.x=Math.PI/2;torso.add(belt);
 
 const head=new THREE.Group();head.position.set(0,2.38,0);torso.add(head);
 sphere(head,0,0,0,.43,skin);
 const faceMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.85,transparent:true});
 const face=new THREE.Mesh(new THREE.SphereGeometry(.345,24,16,0,Math.PI,0,Math.PI),faceMat);
 face.position.set(0,0,.23);face.rotation.y=Math.PI;face.scale.set(1,.95,.5);head.add(face);
 
 const hair=sphere(head,0,.2,-.05,.45,mat(selected==='sara'?0x3b241b:0x241c18));hair.scale.set(1,.48,1);
 if(selected==='sara'){const braid=cylinder(head,-.32,-.25,-.02,.12,.1,.65,mat(0x4a2a1d));braid.rotation.z=-.25}

 const armL=createLimb(torso,.82,.16,selected==='sara'?mat(0xd75d78):cloth);
 const armR=createLimb(torso,.82,.16,selected==='sara'?mat(0xd75d78):cloth);
 armL.position.set(-.58,1.72,0);armR.position.set(.58,1.72,0);

 const legL=createLimb(torso,.9,.19,pants);
 const legR=createLimb(torso,.9,.19,pants);
 legL.position.set(-.24,.85,0);legR.position.set(.24,.85,0);
 for(const l of [legL,legR]){const b=box(l,0,-.55,.1,.38,.22,.55,boots);b.position.y=-.72}

 const weapon=new THREE.Group();weapon.position.set(.75,1.2,.05);torso.add(weapon);
 box(weapon,0,-.08,.25,.12,.16,.42,mat(0x704326));
 const blade=new THREE.Mesh(new THREE.BoxGeometry(.12,.09,1.05),mat(0xcbd8e1,.1,.9));blade.position.z=.93;weapon.add(blade);

 const shield=new THREE.Group();shield.position.set(-.72,1.22,.08);torso.add(shield);
 const sh=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.12,6),gold);sh.rotation.x=Math.PI/2;shield.add(sh);

 player={root,torso,head,armL,armR,legL,legR,weapon,shield,velocity:V(0,0,0),yaw:Math.PI,onGround:true,attack:0,roll:0,magic:0,faceMat,face};
 applyFaceTexture();
}

function applyFaceTexture(){
 if(!player)return;
 if(faceTexture){player.faceMat.map=faceTexture;player.faceMat.needsUpdate=true;player.faceMat.color.set(0xffffff)}
 else{player.faceMat.map=null;player.faceMat.color.set(0xf0c29e)}
}

// حارس ذكي مع منطقة دورية ونظام استشعار (Aggro) ومطاردة
function createEnemy(x,z,isBoss=false){
 const g=new THREE.Group();g.position.set(x,0,z);
 const scale=isBoss?1.8:1;g.scale.setScalar(scale);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.72,4,8),mat(isBoss?0xa83232:0x783c32));
 body.position.y=1.15;g.add(body);
 sphere(g,0,2.02,0,.38,mat(0x343d49,.4,.4));
 return {
  group:g,
  home:V(x,0,z),
  phase:Math.random()*5,
  hp:isBoss?5:2,
  isBoss,
  aggroRange:6.5, // نطاق الإحساس باللاعب
  speed:isBoss?2.4:1.8
 };
}

function createProjectile(){
 if(mana<20){message('المانا غير كافية!');return}
 mana-=20;updateHud();
 const m=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),new THREE.MeshBasicMaterial({color:0x8eeaff}));
 scene.add(m);
 const dir=V(Math.sin(player.yaw),0,Math.cos(player.yaw));
 m.position.copy(player.root.position).add(V(0,1.7,0)).add(dir.clone().multiplyScalar(1));
 projectiles.push({mesh:m,vel:dir.multiplyScalar(18),life:2});
}

function setFace(file){
 if(!file)return;
 const url=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{
  const c=document.createElement('canvas');c.width=512;c.height=512;
  const ctx=c.getContext('2d');const size=Math.min(img.width,img.height),sx=(img.width-size)/2,sy=(img.height-size)/2;
  ctx.drawImage(img,sx,sy,size,size,0,0,512,512);
  faceTexture=new THREE.CanvasTexture(c);faceTexture.colorSpace=THREE.SRGBColorSpace;
  applyFaceTexture();
  $('status').textContent='تم دمج ملامح الوجه بنجاح.';
 };
 img.src=url;
}

function updateHud(){
 $('score').textContent=score;
 $('lives').textContent=lives;
 $('manaFill').style.width=mana+'%';
}

function startGame(){
 if(!renderer)return;
 playing=true;paused=false;
 $('menu').style.display='none';
 $('hud').style.display='flex';
 $('controls').style.display='flex';
 $('pause').textContent='Ⅱ إيقاف';
 clock.getDelta();
 message('استكشف العالم وتجنب الحراس!');
}

function backMenu(){
 $('menu').style.display='flex';
 $('hud').style.display='none';
 $('controls').style.display='none';
 playing=false;paused=false;
 if(score>highScore){highScore=score;localStorage.setItem('adv_highScore',highScore);$('highScoreText').textContent=highScore}
}

function pauseGame(){paused=!paused;$('pause').textContent=paused?'▶ متابعة':'Ⅱ إيقاف'}

function attack(){
 if(!playing||paused)return;
 player.attack=.38;player.weapon.rotation.x=-.8;
 const p=player.root.position;
 for(const e of enemies){
  if(e.hp<=0)continue;
  const dx=e.group.position.x-p.x,dz=e.group.position.z-p.z;
  if(Math.hypot(dx,dz)<2.6){
   e.hp--;e.group.position.x+=Math.sign(dx)*1.2;
   if(e.hp<=0){
    e.group.visible=false;
    score+=e.isBoss?200:30;
    mana=Math.min(100,mana+25);
    updateHud();
    if(e.isBoss){message('🏆 مبروك! هزمت حارس القلعة الرئيسي!');setTimeout(()=>backMenu(),3000)}
   }
  }
 }
}

function interact(){
 if(!playing||paused)return;
 const p=player.root.position;
 if(!isInside&&doorTrigger&&Math.hypot(p.x-doorTrigger.x,p.z-doorTrigger.z)<5){
  enterCastleInterior();
  return;
 }
 if(isInside){
  // الخروج من القلعة للمرحلة التالية
  if(stage<3){score+=150;stage++;buildStage(stage);message('انتقلت إلى المرحلة التالية!');}
  else{message('أكملت جميع المراحل بنجاح!');backMenu();}
 }
}

function jump(){if(!playing||paused)return;if(player.onGround){player.velocity.y=8.4;player.onGround=false}}

// التحكم باللمس والكيبورد
const moveButton=(id,fn)=>{
 const b=$(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();fn(true);b.setPointerCapture?.(e.pointerId)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();fn(false)}));
};
moveButton('leftBtn',v=>keys.left=v);moveButton('rightBtn',v=>keys.right=v);
moveButton('upBtn',v=>keys.up=v);moveButton('downBtn',v=>keys.down=v);

$('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
$('attackBtn').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
$('magicBtn').addEventListener('pointerdown',e=>{e.preventDefault();createProjectile()});
$('rollBtn').addEventListener('pointerdown',e=>{e.preventDefault();player.roll=.55});
$('interactBtn').addEventListener('pointerdown',e=>{e.preventDefault();interact()});

window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
 if(e.key==='ArrowUp'||e.key==='w')keys.up=true;
 if(e.key==='ArrowDown'||e.key==='s')keys.down=true;
 if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();
 if(e.key==='j')attack();if(e.key==='k')createProjectile();if(e.key==='e')interact();if(e.key==='Escape')pauseGame();
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
 if(e.key==='ArrowUp'||e.key==='w')keys.up=false;
 if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
});

$('sara').onclick=()=>{selected='sara';$('sara').classList.add('selected');$('moh').classList.remove('selected');rebuildAvatar()};
$('moh').onclick=()=>{selected='moh';$('moh').classList.add('selected');$('sara').classList.remove('selected');rebuildAvatar()};
function rebuildAvatar(){if(!player)return;const pos=player.root.position.clone();scene.remove(player.root);createPlayer();player.root.position.copy(pos);if(faceTexture)applyFaceTexture()}

$('photo').onchange=e=>{if(e.target.files[0])setFace(e.target.files[0])};
$('removePhoto').onclick=()=>{faceTexture=null;applyFaceTexture();$('status').textContent='تمت إزالة الصورة.'};
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-stage]').forEach(x=>x.classList.remove('selected'));
 b.classList.add('selected');stage=Number(b.dataset.stage);if(world)buildStage(stage);
});

$('start').onclick=()=>startGame();$('pause').onclick=()=>pauseGame();$('back').onclick=()=>backMenu();
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 الصوت يعمل':'🔇 الصوت مغلق'};

function update(dt){
 if(!playing||paused)return;
 const p=player;
 const move=(keys.right?1:0)-(keys.left?1:0);
 const forward=(keys.up?1:0)-(keys.down?1:0);
 const speed=p.roll>0?8.5:5.4;
 let dx=move*speed*dt,dz=-forward*speed*dt;

 if(move!==0){p.yaw=move>0?Math.PI/2:-Math.PI/2;p.root.rotation.y=p.yaw}
 if(forward){p.yaw=forward>0?0:Math.PI;p.root.rotation.y=p.yaw}

 // كشف الاصطدام مع الجدران لمنع اختراقها
 let nextX=p.root.position.x+dx;
 let nextZ=p.root.position.z+dz;
 let canMove=true;
 for(const w of walls){
  if(nextX>w.minX-.4&&nextX<w.maxX+.4&&nextZ>w.minZ-.4&&nextZ<w.maxZ+.4){canMove=false;break;}
 }
 if(canMove){
  p.root.position.x=THREE.MathUtils.clamp(nextX,-35,35);
  p.root.position.z=THREE.MathUtils.clamp(nextZ,-60,20);
 }

 p.velocity.y-=21*dt;p.root.position.y+=p.velocity.y*dt;
 if(p.root.position.y<=0){p.root.position.y=0;p.velocity.y=0;p.onGround=true}

 const moving=Math.abs(move)+Math.abs(forward)>0;
 const t=clock.elapsedTime;
 const swing=moving?Math.sin(t*11)*.75:Math.sin(t*2)*.035;
 p.legL.rotation.x=swing;p.legR.rotation.x=-swing;

 if(p.attack>0){p.attack-=dt;p.armR.rotation.x=-1.5}

 // جمع الجواهر
 for(const g of gems){
  if(g.taken)continue;
  g.mesh.rotation.y+=dt*2;
  if(g.mesh.position.distanceTo(p.root.position.clone().add(V(0,1,0)))<1.3){
   g.taken=true;g.mesh.visible=false;score+=12;
   mana=Math.min(100,mana+8);
   updateHud();
  }
 }

 // 🔥 ذكاء الحراس: إحساس باللاعب ومطاردته
 for(const e of enemies){
  if(e.hp<=0)continue;
  const distToPlayer=e.group.position.distanceTo(p.root.position);
  
  if(distToPlayer<e.aggroRange){
   // الحارس يشعر باللاعب ويبدأ بمطاردته!
   e.group.lookAt(p.root.position.x,e.group.position.y,p.root.position.z);
   e.group.translateZ(e.speed*dt);
  }else{
   // العودة للدورية العادية
   e.phase+=dt;
   e.group.position.x=e.home.x+Math.sin(e.phase)*1.2;
  }

  // الاصطدام باللاعب وإحداث ضرر
  if(distToPlayer<1.4&&p.roll<=0){
   if(!e.lastHit||t-e.lastHit>1.6){
    e.lastHit=t;lives--;updateHud();
    message('احذر! الحارس هاجمك!');
    p.root.position.z+=2.2;
    if(lives<=0){lives=3;score=Math.max(0,score-50);updateHud();backMenu();$('status').textContent='انتهت المحاولات!'}
   }
  }
 }

 for(let i=projectiles.length-1;i>=0;i--){
  const q=projectiles[i];q.mesh.position.addScaledVector(q.vel,dt);q.life-=dt;
  if(q.life<=0){scene.remove(q.mesh);projectiles.splice(i,1);continue}
  for(const e of enemies){
   if(e.hp>0&&q.mesh.position.distanceTo(e.group.position.clone().add(V(0,1,0)))<1.5){
    e.hp--;q.life=0;if(e.hp<=0){e.group.visible=false;score+=35;updateHud()}
    break;
   }
  }
 }

 const desired=V(p.root.position.x,isInside?5:7.2,p.root.position.z+(isInside?8:11));
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(p.root.position.x,isInside?1:1.6,p.root.position.z-(isInside?4:2.8));

 if(!isInside&&doorTrigger){
  const near=Math.hypot(p.root.position.x-doorTrigger.x,p.root.position.z-doorTrigger.z)<5;
  $('hint').textContent=near?'أمام باب القلعة – اضغط 🚪 للدخول والاستكشاف':'اجمع الجواهر واحذر الحراس!';
 }else if(isInside){
  $('hint').textContent='أنت داخل القلعة! اقترب من المخرج أو اهزم الحارس';
 }
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 renderer.render(scene,camera);
}

function resize(){
 if(!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
window.addEventListener('resize',resize);
init();
</script>
</body>
</html>
