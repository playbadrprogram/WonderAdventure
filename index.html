<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>عالم المغامرات العجيب - النسخة المطورة</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#101b25;color:#fff;font-family:Tahoma,Arial,sans-serif;text-align:center;overflow:hidden;touch-action:none}
button{font-family:inherit;cursor:pointer}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#102b38,#164d48,#382d55);padding:15px;overflow:auto}
.panel{width:min(540px,100%);padding:22px;border:2px solid #8ce7bd;border-radius:24px;background:#142c38ed;box-shadow:0 0 35px #0008}
h1{color:#ffe77b;font-size:clamp(24px,6vw,36px);margin:5px}
.subtitle{color:#bcebd7;margin:10px 0 16px;font-size:14px}
.characters{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
.character{width:135px;padding:12px;border:2px solid #527b7b;border-radius:16px;background:#203e49;color:#fff}
.character.selected{border:3px solid #ffe77b;background:#315b50}
.avatar{width:85px;height:85px;margin:auto auto 8px;border-radius:50%;background:#c9e8d2;object-fit:cover;display:block}
.upload{display:block;margin:15px auto;color:#fff}
.mainbtn{border:0;border-radius:30px;padding:13px 35px;font-size:19px;font-weight:bold;color:#17352d;background:linear-gradient(#ffe88b,#ffbd4b);box-shadow:0 5px 0 #a76d28}
.mainbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #a76d28}
#game{display:none;width:100vw;height:100dvh;position:relative}
canvas{display:block;width:100%;height:100%;background:#000}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;left:8px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:5px}
.hudbox{background:#102b31c9;border:1px solid #b9f4d5;border-radius:12px;padding:6px 9px;font-weight:bold;font-size:12px;text-shadow:1px 1px 2px #000;white-space:nowrap}
#pause,#mute{pointer-events:auto;border:0;border-radius:50%;width:40px;height:40px;font-size:19px;background:#fff;color:#183d38;flex:none}
#controls{position:absolute;bottom:calc(15px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.controlgroup{display:flex;gap:12px;pointer-events:auto}
.ctrl{width:66px;height:66px;border-radius:50%;border:2px solid #fff9;background:#153c43bb;color:#fff;font-size:29px;font-weight:bold;box-shadow:0 4px 8px #0005;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl:active{background:#e6b94d;color:#203b32}
#message{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);background:#102c35ed;padding:20px 26px;border-radius:20px;border:2px solid #ffe77b;display:none;min-width:250px;z-index:5}
#message button{margin:8px}
#help{font-size:12px;color:#b9d9d0;margin-top:15px}
.upbtn{position:relative;display:block;margin:12px auto;padding:11px 16px;border-radius:14px;background:#2c6f63;border:2px dashed #8ce7bd;color:#fff;font-size:15px}
.upbtn input,.mini input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
#pstat{font-size:12px;color:#ffe77b;min-height:16px}
.bgrow{font-size:12px;color:#bcebd7;margin:6px 0 14px}
.mini{position:relative;display:inline-block;width:42px;height:34px;line-height:34px;margin:4px;border-radius:10px;background:#2c6f63;color:#fff;font-size:15px;overflow:hidden}
.mini.ok{background:#3c9a5a}
.controlgroup.r{display:grid;grid-template-columns:repeat(3,58px);gap:8px;direction:ltr}
.r .ctrl{width:58px;height:58px;font-size:23px}
.hudbox{padding:5px 7px;font-size:11px}
@media(max-height:500px){.ctrl,.r .ctrl{width:46px;height:46px;font-size:19px}.controlgroup.r{grid-template-columns:repeat(3,46px);gap:5px}#controls{bottom:7px}}
</style>
</head>
<body>
<div id="menu"><div class="panel">
 <h1>🌳 عالم المغامرات العجيب 🌳</h1>
 <div class="subtitle">٤ مراحل: غابة · صحراء · جليد · براكين</div>
 <h3>اختر بطلك للمغامرة</h3>
 <div class="characters">
  <button class="character selected" id="sara"><img class="avatar" id="saraImg" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='49' fill='%23f7c7a7'/%3E%3Ccircle cx='50' cy='38' r='23' fill='%23e9b38e'/%3E%3Cpath d='M25 40 Q20 0 55 12 Q88 15 75 57 L68 38 Q50 25 31 43Z' fill='%23452d36'/%3E%3Ccircle cx='42' cy='39' r='3'/%3E%3Ccircle cx='59' cy='39' r='3'/%3E%3Cpath d='M42 51 Q50 59 59 51' stroke='%23944' fill='none' stroke-width='2'/%3E%3Cpath d='M23 100 Q25 65 50 65 Q78 65 80 100' fill='%23e65c89'/%3E%3C/svg%3E">سارة 👧</button>
  <button class="character" id="mohamed"><img class="avatar" id="mohamedImg" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='49' fill='%23f2c49d'/%3E%3Ccircle cx='50' cy='39' r='23' fill='%23dca47d'/%3E%3Cpath d='M27 34 Q28 7 55 13 Q77 14 75 37 Q54 23 27 34' fill='%23362b27'/%3E%3Ccircle cx='42' cy='40' r='3'/%3E%3Ccircle cx='59' cy='40' r='3'/%3E%3Cpath d='M42 52 Q50 57 59 52' stroke='%23944' fill='none' stroke-width='2'/%3E%3Cpath d='M23 100 Q25 65 50 65 Q78 65 80 100' fill='%234b86c8'/%3E%3C/svg%3E">محمد 👦</button>
 </div>
 <label class="upbtn">📷 اختر صورتك من الهاتف (تُحسَّن تلقائيًا)<input type="file" id="photo" accept="image/*"></label><div id="pstat"></div>
 <div class="bgrow">🖼️ خلفية حقيقية لكل مرحلة من صورك:<br><label class="mini" id="bl0">١<input type="file" accept="image/*" data-bg="0"></label><label class="mini" id="bl1">٢<input type="file" accept="image/*" data-bg="1"></label><label class="mini" id="bl2">٣<input type="file" accept="image/*" data-bg="2"></label><label class="mini" id="bl3">٤<input type="file" accept="image/*" data-bg="3"></label><button id="bgreset" style="border:0;border-radius:10px;padding:7px 10px;margin:4px">مسح</button></div>
 <button class="mainbtn" id="start">ابدأ المغامرة ▶</button>
 <div id="help">اجمع العملات، اقفز فوق الوحوش، وصل إلى بوابة كل مرحلة!</div>
</div></div>

<div id="game">
 <canvas id="canvas"></canvas>
 <div id="hud">
  <div class="hudbox">🗺️ <span id="lvl">1</span>/4</div>
  <div class="hudbox">⭐ <span id="score">0</span></div>
  <div class="hudbox">🪙 <span id="coins">0</span></div>
  <div class="hudbox">🌟 <span id="ammo">10</span></div>
  <div class="hudbox">❤️ <span id="lives">3</span></div>
  <div class="hudbox">🏆 <span id="best">0</span></div>
  <button id="mute">🔊</button><button id="pause">Ⅱ</button>
 </div>
 <div id="controls">
  <div class="controlgroup"><button class="ctrl" id="right">▶</button><button class="ctrl" id="left">◀</button></div>
  <div class="controlgroup r"><button class="ctrl" id="atk">⚔</button><button class="ctrl" id="thr">🌟</button><button class="ctrl" id="guard">🛡</button><button class="ctrl" id="roll">🌀</button><button class="ctrl" id="jump">⬆</button></div>
 </div>
 <div id="message"></div>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("canvas"),ctx=canvas.getContext("2d"),menu=$("menu"),game=$("game"),message=$("message");
const VH=540,FLOOR=440,TAU=Math.PI*2;
let W=960,H=VH;
let shakeTimer = 0, shakeIntensity = 0;

function triggerShake(duration, intensity) {
    shakeTimer = duration;
    shakeIntensity = intensity;
}

function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 const cw=canvas.clientWidth||innerWidth,ch=canvas.clientHeight||innerHeight;
 canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);
 const s=canvas.height/VH;ctx.setTransform(s,0,0,s,0,0);
 W=canvas.width/s;H=VH;
}
addEventListener("resize",resize);
const mod=(a,m)=>((a%m)+m)%m;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

const TH=[
{name:"الغابة السحرية",sky:["#4fa9d6","#a9dfc9","#eee7b4"],sun:[.78,.2,"#fff6c0"],far:["#5f9a93","#7fb5a4","#3f8466"],haze:"#dff5e0",top:"#4fae4a",top2:"#2f7d38",dirt:"#6b4730",dirt2:"#3f2818",liq:"#2c8fb8",spike:"#cfd8d2",en:["#8c58c6","#c4694a","#5aa14f"],deco:"tree",w:"leaf",tint:"#ffffd0",cloud:"#fff"},
{name:"صحراء الذهب",sky:["#e0813f","#f6c57c","#fbe6b0"],sun:[.7,.34,"#fff0b0"],far:["#c98f5a","#d9a870","#b9784a"],haze:"#fbe3b4",top:"#e8c779",top2:"#c99a50",dirt:"#c79a56",dirt2:"#8e6630",liq:"#a8793a",spike:"#8a6a45",en:["#a8472f","#6a4b8a","#c28f2a"],deco:"cactus",w:"dust",tint:"#ffc070",cloud:"#fff3d8"},
{name:"جبال الجليد",sky:["#6e93be","#c8dcec","#f4f8fc"],sun:[.25,.22,"#ffffff"],far:["#8fa9c6","#a9c0d8","#7c97b6"],haze:"#eef5fb",top:"#f8fbfe",top2:"#cfe2ef",dirt:"#7d9bb5",dirt2:"#4f6d89",liq:"#2f6592",spike:"#bfe8ff",en:["#4a76b8","#7a8fc8","#3d9aa8"],deco:"pine",w:"snow",tint:"#c8e0ff",cloud:"#f4f8ff"},
{name:"وادي البراكين",sky:["#1d0a16","#5c1a1c","#d0502a"],sun:[.5,.78,"#ff9a40"],far:["#2b1a22","#3a2024","#4d2523"],haze:"#ff7a3a",top:"#6b4030",top2:"#9a5028",dirt:"#3a2a2e",dirt2:"#1c1216",liq:"#ff5a1a",spike:"#8a2a2a",en:["#d1432c","#7a2b6a","#e08a20"],deco:"dead",w:"ember",tint:"#ff6a30",cloud:"#2a1216"}
];

let selected="sara",customPhoto=null,playerImage=null;
let playing=false,paused=false,gameOver=false,between=false;
let score=0,coinCount=0,lives=3,level=0,best=Number(load("wonderBest")||0);
let cameraX=0,lastTime=0,elapsed=0,walkT=0,banner=0,lastSafe=70,WORLD=4000;
const keys={left:false,right:false};
let jumpPressed=false;
const player={x:70,y:300,w:36,h:64,vx:0,vy:0,speed:430,jump:-770,onGround:false,invincible:0,facing:1,jumps:0,flipT:0,roll:0,rollcd:0,cd:0,tcd:0,atk:0,guard:false,ammo:10};
let th=TH[0],platforms=[],coins=[],spikes=[],enemies=[],particles=[],decs=[],weather=[],pat=null;
const chest={x:0,y:0,opened:false},portal={x:0,y:344};

function makePattern(){
 const c=document.createElement("canvas");c.width=c.height=96;
 const g=c.getContext("2d"),R=rng(level*31+5);
 g.fillStyle=th.dirt;g.fillRect(0,0,96,96);
 for(let i=0;i<320;i++){g.globalAlpha=.15+R()*.3;g.fillStyle=R()<.7?th.dirt2:"#fff";if(g.fillStyle==="#ffffff")g.globalAlpha=.08;g.beginPath();g.arc(R()*96,R()*96,.8+R()*2.6,0,TAU);g.fill()}
 g.globalAlpha=.25;g.fillStyle=th.dirt2;
 for(let i=0;i<7;i++){g.beginPath();g.ellipse(R()*96,R()*96,5+R()*5,3+R()*3,R(),0,TAU);g.fill()}
 pat=ctx.createPattern(c,"repeat");
}

function build(L){
 th=TH[L];const R=rng(L*977+13);
 WORLD=3600+L*500;
 platforms=[{x:0,y:FLOOR,w:620,h:100,g:1}];
 coins=[];spikes=[];enemies=[];decs=[];
 let x=620,id=0;const maxGap=115+L*14;
 while(x<WORLD-950){
  const gap=80+R()*(maxGap-80);
  if(gap>112){platforms.push({x:x+gap/2-45,y:FLOOR-85,w:90,h:18});}
  coins.push({id:id++,x:x+gap/2,y:FLOOR-135,got:false});
  x+=gap;
  const w=360+R()*260;
  platforms.push({x,y:FLOOR,w,h:100,g:1});
  if(w>420&&R()<.55+L*.1)spikes.push({x:x+w*.55,y:FLOOR-22,w:55,h:22});
  enemies.push({x:x+w*.3,y:FLOOR-56,min:x+20,max:x+w-60,v:70+R()*40+L*14,type:Math.floor(R()*3),alive:true,ph:R()*6,hp:2,jy:0,jv:0,kb:0,cd:2,hitCd:0,face:1,dir:1});
  if(R()<.65){const px=x+w*.15+R()*w*.4;const py=FLOOR-(125+R()*35);platforms.push({x:px,y:py,w:110,h:18});coins.push({id:id++,x:px+55,y:py-38,got:false})}
  x+=w;
 }
 x+=100;
 platforms.push({x,y:FLOOR,w:WORLD-x+300,h:100,g:1});
 chest.x=x+170;chest.y=FLOOR-50;chest.opened=false;
 portal.x=WORLD-120;portal.y=FLOOR-96;
 for(const p of platforms){
  if(!p.g)continue;
  for(let c=p.x+50;c<p.x+p.w-40;c+=105)coins.push({id:id++,x:c,y:FLOOR-55-((c/105|0)%2)*55,got:false});
  for(let d=p.x+60+R()*60;d<p.x+p.w-40;d+=150+R()*90)decs.push({x:d,s:.85+R()*.5,v:R()});
 }
 spikes.forEach(s=>{decs=decs.filter(d=>Math.abs(d.x-s.x-27)>45)});
 weather=[];
 for(let i=0;i<70;i++)weather.push({x:R()*1200,y:R()*VH,r:R(),ph:R()*6});
 makePattern();
}

function loadImage(){
 playerImage=null;
 const src=customPhoto||load("wonderPhoto_"+selected);
 if(!src)return;
 const img=new Image();img.onload=()=>playerImage=img;img.src=src;
 if(customPhoto)store("wonderPhoto_"+selected,customPhoto);
}
function selectCharacter(n){selected=n;$("sara").classList.toggle("selected",n==="sara");$("mohamed").classList.toggle("selected",n==="mohamed")}
$("sara").onclick=()=>selectCharacter("sara");
$("mohamed").onclick=()=>selectCharacter("mohamed");
$("photo").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;
 $("pstat").textContent="⏳ جاري تحسين الصورة...";
 enhance(f,d=>{if(!d){$("pstat").textContent="⚠ تعذّر قراءة الصورة، جرّب صورة JPG أو PNG";return}customPhoto=d;$(selected==="sara"?"saraImg":"mohamedImg").src=d;$("pstat").textContent="✔ تم ضبط الصورة للاعب"});e.target.value="";
});
$("start").onclick=()=>{initAudio();loadImage();menu.style.display="none";game.style.display="block";resize();startGame()};

function startGame(){player.ammo=10;score=0;coinCount=0;lives=3;level=0;gameOver=false;paused=false;between=false;startLevel();playing=true;lastTime=performance.now();requestAnimationFrame(loop)}
function startLevel(){
 initAudio();
 startMusic();build(level);cameraX=0;elapsed=0;banner=3.2;lastSafe=70;
 player.x=70;player.y=300;player.vx=0;player.vy=0;player.invincible=0;particles=[];shur=[];eproj=[];player.roll=0;player.atk=0;player.flipT=0;
 updateHUD();
}
function updateHUD(){$("score").textContent=score;$("coins").textContent=coinCount;$("lives").textContent=lives;$("best").textContent=best;$("lvl").textContent=level+1;$("ammo").textContent=player.ammo}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function addScore(n,x,y){
 score+=n;
 triggerShake(0.12, 4);
 for(let i=0;i<12;i++) {
  particles.push({
   x, y,
   vx:(Math.random()-.5)*220,
   vy:-Math.random()*220 - 50,
   life:.8,
   color: i%2===0 ? '#ffe77b' : '#ffffff',
   size: 3 + Math.random()*4
  });
 }
 updateHUD();
}

function hurt(){
 if(player.invincible>0||gameOver)return;
 lives--;sfx("hurt");player.invincible=1.6;player.vy=-400;player.vx=-player.facing*180;
 triggerShake(0.3, 10);
 updateHUD();
 if(lives<=0)endGame(false);
}

function update(dt){
 if(!playing||paused||gameOver)return;
 elapsed+=dt;banner=Math.max(0,banner-dt);
 player.invincible=Math.max(0,player.invincible-dt);
 
 if(shakeTimer > 0) shakeTimer -= dt;

 const dir=(keys.right?1:0)-(keys.left?1:0);
 player.guard=!!keys.guard&&player.roll<=0;
 if(player.roll>0){player.roll-=dt;player.vx=player.facing*player.speed*1.5;rollA+=dt*18}
 else{player.vx=dir*player.speed*(player.guard?.45:1);if(dir){player.facing=dir;if(player.onGround)walkT+=dt*20}}
 if(player.onGround)player.jumps=0;
 if(jumpPressed&&player.roll<=0&&player.jumps<2){player.vy=player.jumps?-700:player.jump;player.jumps++;player.flipT=player.jumps===2?.01:0;player.onGround=false;sfx('jump')}
 jumpPressed=false;
 player.vy+=1750*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;
 player.x=Math.max(0,Math.min(WORLD-player.w,player.x));
 player.onGround=false;
 for(const p of platforms){
  if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h-player.vy*dt<=p.y+8){
   player.y=p.y-player.h;player.vy=0;player.onGround=true;
   if(p.g&&player.x>p.x+15&&player.x<p.x+p.w-70)lastSafe=player.x;
  }
 }
 if(player.y>H+150){hurt();if(!gameOver){player.x=lastSafe;player.y=FLOOR-180;player.vy=0;player.vx=0}}
 for(const c of coins){
  if(!c.got&&Math.abs(player.x+player.w/2-c.x)<30&&Math.abs(player.y+player.h/2-c.y)<36){c.got=true;coinCount++;sfx('coin');if(coinCount%5===0){player.ammo++;sfx('ammo')}addScore(10,c.x,c.y)}
 }
 for(const s of spikes)if(rectHit(player,{x:s.x+8,y:s.y,w:s.w-16,h:s.h}))hurt();
 for(const e of enemies){
  if(!e.alive)continue;
  enemyAI(e,dt);
  if(e.hp>0&&rectHit(player,eb(e))){if(player.roll>0){hitEnemy(e,1);continue}if(player.guard&&Math.sign(e.x-player.x)===player.facing){sfx('block');e.kb=player.facing*300;continue}
   if(player.vy>100&&player.y+player.h<e.y+22){e.alive=false;sfx("stomp");player.vy=-420;triggerShake(0.2, 7);addScore(50,e.x,e.y)}else hurt();
  }
 }
 combat(dt);if(!chest.opened&&rectHit(player,{x:chest.x,y:chest.y,w:48,h:50})){chest.opened=true;sfx("chest");coinCount+=5;triggerShake(0.25, 8);addScore(100,chest.x,chest.y)}
 if(rectHit(player,{x:portal.x,y:portal.y,w:60,h:96})){finishLevel();return}
 cameraX=Math.max(0,Math.min(WORLD-W,player.x-W*.36));
 
 for(const p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vy+=600*dt;
  p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);

 for(const w of weather){
  const t=elapsed+w.ph;
  if(th.w==="leaf"){w.y+=(35+w.r*30)*dt;w.x+=(Math.sin(t*2)*30+15)*dt}
  else if(th.w==="dust"){w.x-=(220+w.r*120)*dt;w.y+=Math.sin(t)*10*dt}
  else if(th.w==="snow"){w.y+=(45+w.r*55)*dt;w.x+=Math.sin(t)*22*dt-10*dt}
  else{w.y-=(40+w.r*70)*dt;w.x+=Math.sin(t*2)*20*dt}
  if(w.y>H+10)w.y=-10;if(w.y<-10)w.y=H+10;
  if(w.x<-20)w.x=W+20;if(w.x>W+20)w.x=-20;
 }
}

function finishLevel(){
 sfx("win");score+=200+lives*25;updateHUD();
 triggerShake(0.5, 12);
 if(level>=TH.length-1){endGame(true);return}
 paused=true;between=true;
 message.style.display="block";
 message.innerHTML="<h2>✅ أنهيت مرحلة "+th.name+"!</h2><p>التالي: "+TH[level+1].name+"</p><h3>⭐ "+score+"</h3><button class='mainbtn' id='next'>المرحلة التالية ▶</button>";

 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 if(k==="tree"){
  let g=ctx.createLinearGradient(-10,0,10,0);g.addColorStop(0,"#4a3220");g.addColorStop(1,"#80593a");
  ctx.fillStyle=g;ctx.fillRect(-9,-90,18,92);
  for(let i=0;i<3;i++){
   const cy=-100-i*34,r=50-i*7,cx=i%2?10:-8;
   g=ctx.createRadialGradient(cx-12,cy-14,4,cx,cy,r);
   g.addColorStop(0,v>.5?"#8fd45e":"#7cc95a");g.addColorStop(1,i%2?"#2b7a3b":"#1f6232");
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
  }
 }else if(k==="cactus"){
  const g=ctx.createLinearGradient(-14,0,14,0);g.addColorStop(0,"#69ab5e");g.addColorStop(1,"#376d3c");
  ctx.fillStyle=g;ctx.beginPath();
  ctx.roundRect(-12,-110,24,112,12);ctx.roundRect(-34,-72,12,34,6);ctx.roundRect(-34,-44,28,12,6);
  ctx.roundRect(22,-92,12,34,6);ctx.roundRect(6,-64,28,12,6);ctx.fill();
 }else if(k==="pine"){
  ctx.fillStyle="#5a4030";ctx.fillRect(-6,-30,12,32);
  for(let i=0;i<4;i++){
   const y0=-20-i*36,w=62-i*10;
   const g=ctx.createLinearGradient(-w,0,w,0);g.addColorStop(0,"#2c6648");g.addColorStop(1,"#438a62");
   ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,y0-58);ctx.lineTo(-w,y0);ctx.lineTo(w,y0);ctx.fill();
   ctx.fillStyle="#f4f8fc";ctx.beginPath();ctx.moveTo(0,y0-58);ctx.lineTo(-w*.42,y0-28);ctx.lineTo(w*.42,y0-28);ctx.fill();
  }
 }else{
  ctx.strokeStyle="#2a1a1c";ctx.lineCap="round";ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-100);ctx.stroke();
  ctx.lineWidth=6;ctx.beginPath();
  ctx.moveTo(0,-60);ctx.lineTo(-35,-100);ctx.moveTo(0,-82);ctx.lineTo(30,-125);ctx.moveTo(-35,-100);ctx.lineTo(-45,-132);ctx.stroke();
  ctx.strokeStyle="#ff6a2a55";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(-3,-95);ctx.stroke();
 }
 ctx.restore();
}
function drawBackground(){if(bgImgs[level]){drawPhotoBg();return}
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,th.sky[0]);sky.addColorStop(.6,th.sky[1]);sky.addColorStop(1,th.sky[2]);
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 const sx=W*th.sun[0],sy=H*th.sun[1];
 ctx.fillStyle=th.sun[2];
 [[170,.1],[110,.16],[62,.3],[34,1]].forEach(a=>{ctx.globalAlpha=a[1];ctx.beginPath();ctx.arc(sx,sy,a[0],0,TAU);ctx.fill()});
 ctx.globalAlpha=1;
 for(let i=0;i<6;i++){
  const x=mod(i*310-cameraX*.07-elapsed*6,W+500)-150,y=50+(i*53%110);
  ctx.fillStyle=th.cloud;ctx.globalAlpha=level===3?.35:.55;
  for(let j=0;j<4;j++){ctx.beginPath();ctx.ellipse(x+j*38,y+(j%2)*8,52-j*5,20,0,0,TAU);ctx.fill()}
 }
 ctx.globalAlpha=1;
 ridge(th.far[0],H*.58,150,.06,0);
 ridge(th.far[1],H*.66,110,.12,500);
 ridge(th.far[2],H*.74,80,.22,1200);
 ctx.globalAlpha=.5;
 for(let i=0;i<14;i++)drawDeco(th.deco,mod(i*230-cameraX*.45,W+300)-100,H*.83,.5+(i%3)*.08,i/14);
 ctx.globalAlpha=1;
 const hz=ctx.createLinearGradient(0,H*.6,0,H*.86);
 hz.addColorStop(0,"rgba(255,255,255,0)");hz.addColorStop(1,th.haze);
 ctx.globalAlpha=.55;ctx.fillStyle=hz;ctx.fillRect(0,H*.6,W,H*.26);ctx.globalAlpha=1;
}
function shadow(x,y,w,a){ctx.fillStyle="rgba(0,0,0,"+a+")";ctx.beginPath();ctx.ellipse(x,y,w,5,0,0,TAU);ctx.fill()}
function groundAt(x,y){let m=FLOOR+60;for(const p of platforms)if(x>p.x&&x<p.x+p.w&&p.y>=y-4&&p.y<m)m=p.y;return m}

function drawWorld(){
 ctx.save();
 
 if(shakeTimer > 0) {
  const sx = (Math.random() - 0.5) * shakeIntensity;
  const sy = (Math.random() - 0.5) * shakeIntensity;
  ctx.translate(sx, sy);
 }

 ctx.translate(-cameraX,0);
 const x0=cameraX-80,x1=cameraX+W+80;
 const ly=FLOOR+34;
 const lg=ctx.createLinearGradient(0,ly,0,H);lg.addColorStop(0,th.liq);lg.addColorStop(1,"#000");
 ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(x0,H);
 for(let x=x0;x<=x1;x+=12)ctx.lineTo(x,ly+Math.sin(x*.05+elapsed*2.5)*3);
 ctx.lineTo(x1,H);ctx.fill();
 ctx.fillStyle="rgba(255,255,255,.22)";
 for(let x=x0-mod(x0,60);x<x1;x+=60)ctx.fillRect(x+Math.sin(elapsed*2+x)*8,ly+8,22,2);
 
 for(const d of decs)if(d.x>x0-80&&d.x<x1+80){shadow(d.x,FLOOR+2,34*d.s,.25);drawDeco(th.deco,d.x,FLOOR+2,d.s*1.05,d.v)}
 
 for(const p of platforms){
  if(p.x+p.w<x0||p.x>x1)continue;
  ctx.fillStyle=pat;ctx.fillRect(p.x,p.y,p.w,p.h);
  const sh=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
  sh.addColorStop(0,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,.5)");
  ctx.fillStyle=sh;ctx.fillRect(p.x,p.y,p.w,p.h);
  const tg=ctx.createLinearGradient(0,p.y-4,0,p.y+14);tg.addColorStop(0,th.top);tg.addColorStop(1,th.top2);
  ctx.fillStyle=tg;ctx.beginPath();ctx.roundRect(p.x,p.y-3,p.w,15,5);ctx.fill();
  ctx.fillStyle=th.top;
  for(let x=Math.max(p.x,x0-x0%7);x<Math.min(p.x+p.w,x1);x+=7){const h=4+(x*13%5);ctx.beginPath();ctx.moveTo(x,p.y-2);ctx.lineTo(x+3,p.y-2-h);ctx.lineTo(x+6,p.y-2);ctx.fill()}
  ctx.fillStyle="rgba(255,255,255,.12)";ctx.fillRect(p.x,p.y-3,p.w,2);
 }
 
 for(const s of spikes){
  for(let x=s.x;x<s.x+s.w-1;x+=18){
   const g=ctx.createLinearGradient(x,0,x+18,0);g.addColorStop(0,"#fff");g.addColorStop(.5,th.spike);g.addColorStop(1,"#555");
   ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,s.y+s.h);ctx.lineTo(x+9,s.y);ctx.lineTo(x+18,s.y+s.h);ctx.fill();
  }
 }
 
 for(const c of coins){
  if(c.got||c.x<x0||c.x>x1)continue;
  const sx=Math.cos(elapsed*4+c.id);
  ctx.save();ctx.translate(c.x,c.y+Math.sin(elapsed*3+c.id)*3);ctx.scale(Math.max(.25,Math.abs(sx)),1);
  const g=ctx.createRadialGradient(-3,-3,2,0,0,12);g.addColorStop(0,"#fff3a0");g.addColorStop(1,"#e09a1a");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#b9740f";ctx.fillRect(-2,-5,4,10);ctx.restore();
 }
 
 for(const e of enemies){if(!e.alive||e.x<x0-50||e.x>x1)continue;drawEnemy(e);}
 
 shadow(chest.x+24,chest.y+51,30,.3);
 let g=ctx.createLinearGradient(0,chest.y,0,chest.y+50);g.addColorStop(0,"#b36b36");g.addColorStop(1,"#6e3a18");
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(chest.x,chest.y+14,48,36,4);ctx.fill();
 ctx.fillStyle="#f3bd3b";ctx.beginPath();ctx.roundRect(chest.x-1,chest.y+8,50,12,[8,8,0,0]);ctx.fill();
 ctx.fillRect(chest.x+8,chest.y+20,4,30);ctx.fillRect(chest.x+36,chest.y+20,4,30);
 ctx.fillStyle="#fff1a0";ctx.fillRect(chest.x+20,chest.y+24,9,11);
 if(chest.opened){ctx.font="25px Arial";ctx.textAlign="center";ctx.fillText("✨",chest.x+24,chest.y-4)}
 
 const pg=ctx.createRadialGradient(portal.x+30,portal.y+60,4,portal.x+30,portal.y+60,52);
 pg.addColorStop(0,"#ffffff");pg.addColorStop(.5,"#8fe3ff");pg.addColorStop(1,"#6a4bd0");
 ctx.fillStyle="#3c2f66";ctx.beginPath();ctx.roundRect(portal.x-8,portal.y-8,76,104,[34,34,0,0]);ctx.fill();
 ctx.globalAlpha=.8+Math.sin(elapsed*4)*.2;ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(portal.x,portal.y,60,96,[30,30,0,0]);ctx.fill();ctx.globalAlpha=1;
 ctx.fillStyle="#fff";ctx.font="bold 15px Tahoma,Arial";ctx.textAlign="center";ctx.fillText("البوابة",portal.x+30,portal.y-18);
 
 drawPlayer();
 drawProjectiles();
 
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/.8);
  ctx.fillStyle=p.color || "#ffe77b";
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size || 3, 0, TAU);
  ctx.fill();
  ctx.globalAlpha=1;
 }
 
 ctx.restore();
}

function drawWeather(){
 for(const w of weather){
  if(th.w==="leaf"){ctx.fillStyle=w.r>.5?"#86b84a":"#b7803c";ctx.save();ctx.translate(w.x,w.y);ctx.rotate(elapsed+w.ph);ctx.beginPath();ctx.ellipse(0,0,4,2,0,0,TAU);ctx.fill();ctx.restore()}
  else if(th.w==="dust"){ctx.fillStyle="rgba(255,230,170,.3)";ctx.fillRect(w.x,w.y,10+w.r*24,1.6)}
  else if(th.w==="snow"){ctx.fillStyle="rgba(255,255,255,"+(.5+w.r*.4)+")";ctx.beginPath();ctx.arc(w.x,w.y,1.2+w.r*2.2,0,TAU);ctx.fill()}
  else{ctx.fillStyle="rgba(255,"+(120+w.r*80|0)+",40,.85)";ctx.beginPath();ctx.arc(w.x,w.y,1+w.r*2,0,TAU);ctx.fill()}
 }
}

function render(){
 ctx.clearRect(0,0,W,H);
 drawBackground();drawWorld();drawWeather();
 ctx.globalAlpha=.07;ctx.fillStyle=th.tint;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
 if(level===3){const f=ctx.createLinearGradient(0,H*.6,0,H);f.addColorStop(0,"rgba(255,90,20,0)");f.addColorStop(1,"rgba(255,90,20,"+(.3+Math.sin(elapsed*3)*.06)+")");ctx.fillStyle=f;ctx.fillRect(0,H*.6,W,H*.4)}
 const v=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,Math.max(W,H)*.75);
 v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.45)");ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#123c39aa";ctx.fillRect(W/2-100,10,200,8);
 ctx.fillStyle="#ffe27a";ctx.fillRect(W/2-100,10,200*player.x/WORLD,8);
 if(banner>0){
  ctx.globalAlpha=Math.min(1,banner);ctx.textAlign="center";ctx.direction="rtl";
  ctx.font="bold 38px Tahoma,Arial";ctx.lineWidth=6;ctx.strokeStyle="#000a";ctx.fillStyle="#ffe77b";
  const t="المرحلة "+(level+1)+": "+th.name;ctx.strokeText(t,W/2,H*.3);ctx.fillText(t,W/2,H*.3);ctx.globalAlpha=1;
 }
}

function loop(now){
 if(!playing)return;
 const dt=Math.min((now-lastTime)/1000,.035);lastTime=now;
 update(dt);render();requestAnimationFrame(loop);
}

function endGame(won){
 if(gameOver)return;
 gameOver=true;playing=false;stopMusic();sfx(won?"win":"lose");
 if(score>best){best=score;store("wonderBest",best)}
 updateHUD();render();
 message.style.display="block";
 message.innerHTML=(won?"<h2>🏆 أحسنت! أنهيت كل المراحل!</h2><p>أنت بطل العالم العجيب.</p>":"<h2>💔 انتهت المحاولة!</h2><p>لا تستسلم، حاول مرة أخرى في نفس المرحلة.</p>")+"<h3>⭐ نقاطك: "+score+"</h3><button class='mainbtn' id='again'>إعادة المحاولة من نفس المرحلة</button><br><button class='mainbtn' id='home'>القائمة الرئيسية</button>";
 
 $("again").onclick=()=>{
  message.style.display="none";
  lives=3; // استعادة القلوب
  gameOver=false;
  paused=false;
  startLevel();
  playing=true;
  lastTime=performance.now();
  requestAnimationFrame(loop);
 };
 
 $("home").onclick=()=>{message.style.display="none";game.style.display="none";menu.style.display="flex"};
}

function setControl(id,key){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();initAudio();if(key==="jump")jumpPressed=true;else if(ACT[key])ACT[key]();else keys[key]=true;try{el.setPointerCapture(e.pointerId)}catch(err){}});
 const rel=e=>{e.preventDefault();if(key!=="jump")keys[key]=false};
 el.addEventListener("pointerup",rel);el.addEventListener("pointercancel",rel);el.addEventListener("lostpointercapture",rel);
}
setControl("left","left");setControl("right","right");setControl("jump","jump");setControl("atk","atk");setControl("thr","thr");setControl("roll","roll");setControl("guard","guard");
addEventListener("keydown",e=>{
 initAudio();
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if((e.key==="ArrowUp"||e.key===" "||e.key==="w")&&!e.repeat){jumpPressed=true;e.preventDefault()}
 if(!e.repeat){const k=e.key.toLowerCase();if(k==='x'||k==='j')doAttack();if(k==='c'||k==='k')doThrow();if(k==='s'||k==='arrowdown')doRoll()}
 if(['z','l'].includes(e.key.toLowerCase()))keys.guard=true;
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
 if(['z','l'].includes(e.key.toLowerCase()))keys.guard=false;
});
$("pause").onclick=()=>{
 if(!playing||gameOver||between)return;
 paused=!paused;$("pause").textContent=paused?"▶":"Ⅱ";if(AC){paused?AC.suspend():AC.resume()}
 if(paused){
  message.style.display="block";
  message.innerHTML="<h2>⏸ اللعبة متوقفة</h2><button class='mainbtn' id='resume'>متابعة اللعب</button>";
  $("resume").onclick=()=>{paused=false;if(AC)AC.resume();message.style.display="none";$("pause").textContent="Ⅱ"};
 }else message.style.display="none";
};
$("best").textContent=best;
})();
</script>
