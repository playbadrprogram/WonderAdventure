
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عالم المغامرات العجيب</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111936;color:white;
 font-family:Tahoma,Arial;text-align:center;
}
#app{max-width:900px;margin:auto;padding:12px}
h1{color:#ffe66d;font-size:clamp(25px,5vw,40px)}
.panel{
 background:#202d55;border:2px solid #6878ba;
 border-radius:20px;padding:18px;margin:12px auto;
}
button{
 border:0;border-radius:14px;padding:13px 18px;
 margin:5px;background:#ffca45;color:#332044;
 font-size:17px;font-weight:bold;cursor:pointer;
}
button:active{transform:scale(.96)}
.secondary{background:#55d6be}
.character{
 display:inline-block;background:#344475;
 padding:14px;margin:8px;border:3px solid transparent;
 border-radius:18px;width:140px;
}
.character.selected{border-color:#ffe66d}
.avatar{font-size:65px;display:block}
input[type=file]{width:100%;font-size:12px;margin-top:8px}
#gameArea{display:none}
#hud{display:flex;justify-content:space-around;flex-wrap:wrap;gap:7px;margin:10px}
.stat{background:#344475;padding:9px;border-radius:12px}
canvas{
 width:100%;height:auto;display:block;
 border:4px solid #ffe66d;border-radius:15px;
 touch-action:none;
}
#controls{display:flex;justify-content:space-between;margin-top:12px}
.pad{display:flex;gap:8px}
.control{font-size:25px;width:65px;height:60px;background:#55d6be}
#message{color:#ffe66d;min-height:28px;padding:8px}
</style>
</head>
<body>
<div id="app">
<h1>🌟 عالم المغامرات العجيب 🌟</h1>

<section id="menu" class="panel">
<h2>مرحباً بك في عالم المغامرات!</h2>
<p>اختر شخصيتك وابدأ الرحلة.</p>

<div>
 <div class="character selected" id="saraCard" onclick="choose('sara')">
  <span class="avatar" id="saraPreview">👧</span>
  <b>سارة</b>
  <input type="file" accept="image/*" onclick="event.stopPropagation()" onchange="uploadImage(event,'sara')">
 </div>
 <div class="character" id="mohammedCard" onclick="choose('mohammed')">
  <span class="avatar" id="mohammedPreview">👦</span>
  <b>محمد</b>
  <input type="file" accept="image/*" onclick="event.stopPropagation()" onchange="uploadImage(event,'mohammed')">
 </div>
</div>

<p>🏆 أفضل نتيجة: <span id="best">0</span></p>
<button onclick="startGame()">🚀 ابدأ اللعب</button>
<p><small>اختر صورتك الحقيقية من الهاتف إن أردت.</small></p>
</section>

<section id="gameArea">
<div id="hud">
 <div class="stat">🌍 <span id="worldName">الغابة</span></div>
 <div class="stat">⭐ <span id="score">0</span></div>
 <div class="stat">❤️ <span id="lives">3</span></div>
 <div class="stat">المستوى <span id="level">1</span></div>
 <button class="secondary" onclick="pauseGame()">⏸</button>
 <button class="secondary" onclick="toggleSound()" id="soundBtn">🔊</button>
</div>
<canvas id="game" width="900" height="480"></canvas>
<div id="message">اجمع النجوم وتجنب الوحوش!</div>
<div id="controls">
 <div class="pad">
  <button class="control" id="right">➡️</button>
  <button class="control" id="left">⬅️</button>
 </div>
 <button class="control" id="jump">⬆️</button>
</div>
<button onclick="backToMenu()">القائمة الرئيسية</button>
</section>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=900,H=480;

let selected="sara",images={sara:null,mohammed:null};
let score=0,lives=3,level=1,best=Number(localStorage.adventureBest||0);
let running=false,paused=false,sound=true;
let player,stars,enemies,platforms,portal;
let keys={left:false,right:false};
let audio=null,lastTime=0,frame=0,musicTimer=null;

document.getElementById("best").textContent=best;

function choose(name){
 selected=name;
 document.getElementById("saraCard").classList.toggle("selected",name==="sara");
 document.getElementById("mohammedCard").classList.toggle("selected",name==="mohammed");
}

function uploadImage(event,name){
 const file=event.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{localStorage.setItem("adventure_"+name,reader.result)}catch(e){}
  const img=new Image();
  img.onload=()=>images[name]=img;
  img.src=reader.result;
  document.getElementById(name+"Preview").textContent="📷";
 };
 reader.readAsDataURL(file);
}

["sara","mohammed"].forEach(name=>{
 const saved=localStorage.getItem("adventure_"+name);
 if(saved){
  const img=new Image();
  img.onload=()=>images[name]=img;
  img.src=saved;
  document.getElementById(name+"Preview").textContent="📷";
 }
});

function audioInit(){
 if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
 if(audio.state==="suspended")audio.resume();
}
function tone(freq,duration=.15,type="sine",vol=.1){
 if(!sound)return;
 audioInit();
 const osc=audio.createOscillator(),gain=audio.createGain();
 osc.type=type;osc.frequency.value=freq;
 gain.gain.setValueAtTime(vol,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 osc.connect(gain);gain.connect(audio.destination);
 osc.start();osc.stop(audio.currentTime+duration);
}
function effect(type){
 if(type==="jump"){tone(400);setTimeout(()=>tone(650),70)}
 if(type==="coin"){tone(800);setTimeout(()=>tone(1100),80)}
 if(type==="hit")tone(120,.3,"sawtooth");
 if(type==="win"){[523,659,784,1046].forEach((n,i)=>setTimeout(()=>tone(n,.3),i*130))}
 if(type==="lose"){[400,300,200].forEach((n,i)=>setTimeout(()=>tone(n,.3),i*180))}
}
function toggleSound(){
 sound=!sound;
 document.getElementById("soundBtn").textContent=sound?"🔊":"🔇";
 if(sound){audioInit();tone(600)}
 startMusic();
}
function startMusic(){
 stopMusic();
 if(!sound)return;
 const notes=[262,330,392,330,294,349,440,349];
 let i=0;
 musicTimer=setInterval(()=>{
  if(running&&!paused&&sound)tone(notes[i++%notes.length],.22,"sine",.025);
 },420);
}
function stopMusic(){
 if(musicTimer)clearInterval(musicTimer);
 musicTimer=null;
}

function world(){
 return [
  {name:"الغابة السحرية",sky:"#75d9ff",ground:"#287c48",hill:"#4ba75b"},
  {name:"مملكة الحلوى",sky:"#ffb6dc",ground:"#a64b9a",hill:"#ed7ab8"},
  {name:"قلعة الثلج",sky:"#b9eaff",ground:"#d7f4ff",hill:"#8ec7e8"},
  {name:"جزيرة الكنوز",sky:"#ffc66b",ground:"#bd7932",hill:"#e4a34d"}
 ][(level-1)%4];
}

function makeLevel(){
 platforms=[
  {x:0,y:420,w:900,h:60},
  {x:160,y:335,w:150,h:18},
  {x:390,y:280,w:145,h:18},
  {x:640,y:335,w:145,h:18}
 ];
 stars=[];
 for(let i=0;i<7+level;i++){
  stars.push({x:100+(i*113)%700,y:[365,295,240,300,370][i%5],got:false});
 }
 enemies=[];
 for(let i=0;i<Math.min(2+level,6);i++){
  enemies.push({x:230+i*115,y:390,w:32,h:30,min:180+i*90,max:330+i*90,dir:1,speed:1+level*.2});
 }
 portal={x:820,y:340,w:48,h:80};
 player={x:45,y:350,w:42,h:55,vx:0,vy:0,onGround:false,invulnerable:0};
 updateHUD();
}

function startGame(){
 audioInit();
 score=0;lives=3;level=1;paused=false;running=true;
 document.getElementById("menu").style.display="none";
 document.getElementById("gameArea").style.display="block";
 makeLevel();startMusic();
 lastTime=performance.now();
 requestAnimationFrame(loop);
}
function updateHUD(){
 document.getElementById("score").textContent=score;
 document.getElementById("lives").textContent=lives;
 document.getElementById("level").textContent=level;
 document.getElementById("worldName").textContent=world().name;
}
function collide(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function update(dt){
 player.vx=keys.right?4.2:keys.left?-4.2:0;
 player.x=Math.max(0,Math.min(W-player.w,player.x+player.vx*dt));
 player.vy+=.48*dt;
 player.y+=player.vy*dt;
 player.onGround=false;

 for(const p of platforms){
  if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&
     player.y+player.h>=p.y&&player.y+player.h<=p.y+20){
   player.y=p.y-player.h;player.vy=0;player.onGround=true;
  }
 }
 if(player.y>H+50){hurt();return}
 for(const s of stars){
  if(!s.got&&Math.abs(player.x+player.w/2-s.x)<27&&Math.abs(player.y+player.h/2-s.y)<35){
   s.got=true;score+=10;effect("coin");updateHUD();
  }
 }
 for(const e of enemies){
  e.x+=e.dir*e.speed*dt;
  if(e.x<e.min||e.x>e.max)e.dir*=-1;
  if(player.invulnerable<=0&&collide(player,e)){hurt();if(!running)return}
 }
 if(player.invulnerable>0)player.invulnerable-=dt;
 if(collide(player,portal)){
  if(stars.every(s=>s.got)){
   score+=50;level++;makeLevel();effect("win");
   document.getElementById("message").textContent="رائع! انتقلت إلى عالم جديد 🎉";
  }else{
   document.getElementById("message").textContent="اجمع كل النجوم أولاً ⭐";
  }
 }
}
function hurt(){
 lives--;player.invulnerable=100;
 effect("hit");updateHUD();
 player.x=45;player.y=300;player.vy=0;
 document.getElementById("message").textContent="انتبه! اصطدمت بعقبة!";
 if(lives<=0)endGame(false);
}
function endGame(won){
 running=false;stopMusic();
 effect(won?"win":"lose");
 if(score>best){
  best=score;localStorage.adventureBest=best;
  document.getElementById("best").textContent=best;
 }
 document.getElementById("message").textContent=won?"مبروك! لقد فزت 🏆":"انتهت المحاولات! حاول مجدداً.";
 setTimeout(()=>{
  if(!running&&document.getElementById("gameArea").style.display!=="none"){
   if(confirm("نتيجتك "+score+" نقطة. هل تريد اللعب مجدداً؟"))startGame();
  }
 },500);
}
function pauseGame(){
 if(!running)return;
 paused=!paused;
 document.getElementById("message").textContent=paused?"اللعبة متوقفة مؤقتاً":"أكمل المغامرة!";
 if(!paused){lastTime=performance.now();requestAnimationFrame(loop)}
}
function draw(){
 const w=world();
 ctx.fillStyle=w.sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#ffffff99";
 for(let i=0;i<5;i++){
  let x=(i*210+frame*.15)%1000-50,y=80+i%2*35;
  ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.arc(x+25,y-2,30,0,7);ctx.arc(x+55,y+5,22,0,7);ctx.fill();
 }
 ctx.fillStyle=w.hill;
 for(let i=0;i<6;i++){
  ctx.beginPath();ctx.arc(i*190,420,110,Math.PI,Math.PI*2);ctx.fill();
 }
 for(const p of platforms){
  ctx.fillStyle=w.ground;ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#ffffff55";ctx.fillRect(p.x,p.y,p.w,5);
 }
 ctx.textAlign="center";
 for(const s of stars)if(!s.got){ctx.font="29px Arial";ctx.fillText("⭐",s.x,s.y)}
 for(const e of enemies){ctx.font="32px Arial";ctx.fillText("👾",e.x,e.y+25)}
 ctx.font="48px Arial";ctx.fillText("🚪",portal.x+22,portal.y+49);
 if(images[selected]){
  ctx.save();
  if(player.invulnerable>0&&Math.floor(player.invulnerable/8)%2===0)ctx.globalAlpha=.3;
  ctx.drawImage(images[selected],player.x,player.y,player.w,player.h);
  ctx.restore();
 }else{
  ctx.font="43px Arial";
  ctx.fillText(selected==="sara"?"👧":"👦",player.x+player.w/2,player.y+player.h-2);
 }
}
function loop(now){
 if(!running||paused)return;
 const dt=Math.min((now-lastTime)/16.67,2.5);
 lastTime=now;frame++;
 update(dt);draw();
 if(running)requestAnimationFrame(loop);
}
function jump(){
 if(running&&!paused&&player.onGround){
  player.vy=-11.5;player.onGround=false;effect("jump");
 }
}
function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false));
}
bindButton("left","left");bindButton("right","right");
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();jump()});
window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key==="ArrowUp"||e.key===" "){e.preventDefault();jump()}
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});
function backToMenu(){
 running=false;paused=false;stopMusic();
 document.getElementById("gameArea").style.display="none";
 document.getElementById("menu").style.display="block";
}
draw();
</script>
</body>
</html>
